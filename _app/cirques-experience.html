<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Cirques Experience Operations Hub by CUEPA. Preview with sample data.">
<style>*{box-sizing:border-box}html,body{margin:0;background:#fff}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>try{if(localStorage.getItem("cuepa_look")!=="dark")document.documentElement.classList.add("light")}catch(e){document.documentElement.classList.add("light")}</script>
<title>Cirques Experience · Operations Hub · CUEPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@800&family=Kaushan+Script&display=swap">
<style>
/* CUEPA hub · ELIPAN layout: pure black page, almost-black cards on a 12px grid, one teal spark.
   Dark is the default. html.light switches to the white reading look. */
:root{color-scheme:dark}
html.light{color-scheme:light}
html,body{background:#000000}
html.light,html.light body{background:#ffffff}
.hub{
  --h-ground:#000000;--h-panel:#0b0b0b;--h-panel2:#121212;--h-line:#222222;--h-line2:#1a1a1a;--h-strong:#3a3a3a;
  --h-ink:#ffffff;--h-ink2:#d6d6d6;--h-muted:#a0a0a0;
  --h-teal:#5eead4;--h-turq:#2dd4bf;--h-teal-soft:rgba(45,212,191,.09);--h-teal-line:rgba(45,212,191,.38);
  --h-accent:#2dd4bf;--h-on-accent:#0a0a0a;--h-swap:#ffffff;--h-swap-ink:#0a0a0a;
  --h-bar:rgba(0,0,0,.85);--h-input:#121212;--h-overlay:rgba(0,0,0,.72);
  --h-class:#b69cf0;--h-class-bg:rgba(175,139,232,.11);--h-meet:#78aef0;--h-meet-bg:rgba(47,111,181,.16);
  --h-vend:#e3a33b;--h-vend-bg:rgba(227,163,59,.11);--h-dead-bg:rgba(45,212,191,.10);
  --h-warn:#e3a33b;--h-warn-bg:rgba(227,163,59,.09);--h-warn-line:rgba(227,163,59,.35);
  --h-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.8),0 14px 36px rgba(0,0,0,.7);
  --h-shadow-hover:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.8),0 22px 50px rgba(0,0,0,.8),0 10px 40px rgba(0,0,0,.35);
  --h-display:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--h-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--h-mono:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --h-ease:cubic-bezier(.2,.7,.2,1);
  min-height:100vh;background:var(--h-ground);color:var(--h-ink);font-family:var(--h-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html.light .hub{
  --h-ground:#ffffff;--h-panel:#ffffff;--h-panel2:#f5f6f5;--h-line:#e4e4e4;--h-line2:#ededed;--h-strong:#c9c9c9;
  --h-ink:#0a0a0a;--h-ink2:#3c4547;--h-muted:#5e5e5e;
  --h-teal:#0b756a;--h-teal-soft:#e9f6f3;--h-teal-line:#95cec7;
  --h-accent:#2dd4bf;--h-on-accent:#0a0a0a;--h-swap:#0a0a0a;--h-swap-ink:#ffffff;
  --h-bar:rgba(255,255,255,.88);--h-input:#ffffff;--h-overlay:rgba(10,10,10,.45);
  --h-class:#8a63d2;--h-class-bg:#f2ecfc;--h-meet:#2f6fb5;--h-meet-bg:#eaf2fb;
  --h-vend:#b9771c;--h-vend-bg:#fbf2e3;--h-dead-bg:#e6f6f2;
  --h-warn:#92570c;--h-warn-bg:#fbf2e3;--h-warn-line:#e6c48f;
  --h-shadow:0 1px 2px rgba(10,10,10,.06),0 12px 30px rgba(10,10,10,.07);
  --h-shadow-hover:0 2px 4px rgba(10,10,10,.08),0 20px 44px rgba(10,10,10,.12),0 10px 36px rgba(10,10,10,.10)}
.hub *{box-sizing:border-box}
.hub p{margin:0}
.hub h1,.hub h2,.hub h3{margin:0;font-family:var(--h-display);font-weight:500;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.hub button{font-family:inherit;cursor:pointer}
.hub :focus-visible{outline:2px solid var(--h-turq);outline-offset:2px}
.hub .hub-eyebrow{display:block;color:var(--h-muted);font-family:var(--h-mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

/* Top bar: brand left, Library menu + look switch right. No sidebar. */
.hub .hub-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--h-bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--h-line)}
.hub .hub-bar-in{max-width:1500px;margin:auto;padding:14px clamp(16px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.hub .hub-brand{display:flex;align-items:center;gap:14px;min-width:0}
.hub .hub-mark{display:inline-flex;gap:4px;flex:none}
.hub .hub-mark i{width:9px;height:20px;border-radius:2px;background:var(--h-ink);display:block}
.hub .hub-mark i+i{background:var(--h-turq)}
.hub .hub-wm{font-family:var(--h-body);font-weight:600;letter-spacing:.22em;font-size:16px}
.hub .hub-sep{width:1px;height:20px;background:var(--h-strong);flex:none}
.hub .hub-wsname{font-weight:500;font-size:15px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub .hub-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.hub .hub-lib{position:relative}
.hub .hub-libbtn,.hub .hub-mode{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:8px 12px;border:1px solid var(--h-line);border-radius:6px;background:var(--h-panel);color:var(--h-ink);font-family:var(--h-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;box-shadow:var(--h-shadow);transition:border-color .15s ease}
.hub .hub-mode{background:transparent;box-shadow:none}
.hub .hub-libbtn:hover,.hub .hub-libbtn[aria-expanded="true"],.hub .hub-mode:hover{border-color:var(--h-turq)}
.hub .hub-libk{color:var(--h-muted)}
.hub .hub-libcur{color:var(--h-teal)}
.hub .hub-libbtn svg{transition:rotate .2s var(--h-ease)}
.hub .hub-libbtn[aria-expanded="true"] svg{rotate:180deg}
.hub .hub-libmenu{position:absolute;right:0;top:calc(100% + 8px);width:260px;display:grid;gap:2px;padding:8px;background:var(--h-panel);border:1px solid var(--h-line);border-radius:12px;box-shadow:var(--h-shadow-hover);z-index:30;animation:hubIn .25s var(--h-ease) both}
.hub .hub-libmenu > button{border:0;background:transparent;color:var(--h-muted);font-family:var(--h-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:11px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.hub .hub-libmenu > button:hover{color:var(--h-ink);background:var(--h-panel2)}
.hub .hub-libmenu > button[aria-current="page"]{color:var(--h-ink)}
.hub .hub-libmenu > button[aria-current="page"] .hub-cur{width:6px;height:6px;border-radius:50%;background:var(--h-turq);display:block}
.hub .hub-count{background:transparent;border:1px solid var(--h-teal-line);color:var(--h-teal);border-radius:6px;min-width:22px;height:20px;padding:0 6px;display:grid;place-items:center;font-family:var(--h-mono);font-size:11px;letter-spacing:0}
.hub .hub-libacct{margin-top:6px;border-top:1px solid var(--h-line);padding:12px 12px 4px;display:grid;gap:10px}
.hub .hub-user{display:flex;align-items:center;gap:10px;line-height:1.35;font-size:13px;color:var(--h-muted)}
.hub .hub-user b{color:var(--h-ink)!important;font-weight:600}
.hub .hub-avatar{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--h-panel2);border:1px solid var(--h-line);color:var(--h-ink);font-size:11px;font-weight:600;font-family:var(--h-mono)}
.hub .hub-acctlinks{display:flex;flex-wrap:wrap;gap:6px 14px}
.hub .hub-link{border:0;background:none;padding:0;color:var(--h-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-align:left;font-family:var(--h-body)}
.hub .hub-link:hover{color:var(--h-ink)}

/* Page */
.hub .hub-content{padding:28px clamp(16px,4vw,56px) 96px;max-width:1500px;margin:auto}
.hub .hub-actions{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:30px}
.hub .hub-crumb{color:var(--h-muted);font-family:var(--h-mono);font-size:12px;letter-spacing:.06em}
.hub .hub-top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hub .hub-badge{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--h-line);border-radius:6px;color:var(--h-ink);font-family:var(--h-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.hub .hub-badge i{width:6px;height:6px;flex:none;border-radius:50%;background:var(--h-turq)}
.hub .hub-primary{border:1px solid var(--h-accent);border-radius:999px;min-height:42px;padding:0 18px;background:var(--h-accent);color:var(--h-on-accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.hub .hub-primary:hover{background:var(--h-swap);border-color:var(--h-swap);color:var(--h-swap-ink)}
.hub .hub-primary:disabled{opacity:.45;cursor:default;background:var(--h-accent);border-color:var(--h-accent);color:var(--h-on-accent)}
.hub .hub-hello{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.hub .hub-hello h1,.hub .hub-pagehead h1{font-family:var(--h-display);font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.05;letter-spacing:-.02em;margin:14px 0 12px}
.hub .hub-hello h1 .dot,.hub .hub-pagehead h1 .dot{color:var(--h-turq)}
.hub .hub-hello p,.hub .hub-pagehead p{color:var(--h-muted);line-height:1.6;max-width:60ch;font-size:16px}
.hub .hub-status{color:var(--h-muted);font-size:13px;text-align:right;font-family:var(--h-mono);letter-spacing:.06em;text-transform:uppercase}
.hub .hub-status b{display:block;margin-top:6px;color:var(--h-ink);font-family:var(--h-body);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none}
.hub .hub-status b::first-letter{color:var(--h-turq)}
.hub .hub-pagehead{margin-bottom:28px}

/* Cards */
.hub .hub-card{border:1px solid var(--h-line);background:var(--h-panel);border-radius:18px;padding:28px;min-width:0;box-shadow:var(--h-shadow);transition:border-color .2s ease,box-shadow .25s ease}
.hub .hub-card:hover{border-color:var(--h-teal-line);box-shadow:var(--h-shadow-hover)}
.hub .hub-card-title{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.hub .hub-card h2{font-size:22px;margin-top:8px}
.hub .hub-card h3{font-size:18px;margin-top:8px;font-weight:600}
.hub .hub-tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;font-family:var(--h-mono);font-size:11px;font-weight:500;letter-spacing:.12em;border:1px solid var(--h-teal-line);color:var(--h-teal);background:transparent;border-radius:6px;white-space:nowrap}
.hub .hub-tag-quiet{border-color:var(--h-line);color:var(--h-muted)}
.hub .hub-tag-warn{border-color:var(--h-warn-line);color:var(--h-warn)}
.hub .hub-grid{display:grid;grid-template-columns:.9fr 1.35fr .9fr;gap:12px;align-items:start}
.hub .hub-col{display:grid;gap:12px;min-width:0}

/* Needs you */
.hub .hub-needs{padding:0;overflow:hidden}
.hub .hub-needs .hub-card-title{padding:28px 28px 18px;margin:0;border-bottom:1px solid var(--h-line)}
.hub .hub-need{padding:20px 28px;border-bottom:1px solid var(--h-line);display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
.hub .hub-need:last-child{border-bottom:0}
.hub .hub-need-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--h-strong);color:var(--h-ink);font-family:var(--h-mono);font-size:11px}
.hub .hub-need.done .hub-need-num{background:var(--h-turq);border-color:var(--h-turq);color:var(--h-on-accent)}
.hub .hub-need b{font-size:15px;font-weight:600}
.hub .hub-need p{color:var(--h-muted);font-size:13.5px;line-height:1.55;margin:6px 0 0}
.hub .hub-need .hub-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hub .hub-pill{border:1px solid var(--h-strong);background:transparent;border-radius:999px;min-height:36px;padding:0 13px;font-size:13px;font-weight:600;color:var(--h-ink);transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.hub .hub-pill:hover{border-color:var(--h-ink)}
.hub .hub-pill.hub-go{background:var(--h-accent);border-color:var(--h-accent);color:var(--h-on-accent)}
.hub .hub-pill.hub-go:hover{background:var(--h-swap);border-color:var(--h-swap);color:var(--h-swap-ink)}
.hub .hub-done{margin-top:10px;font-size:13px;font-weight:600;color:var(--h-teal)}

/* Unified calendar */
.hub .hub-sched{padding:0;overflow:hidden}
.hub .hub-sched-head{padding:26px 28px 20px;border-bottom:1px solid var(--h-line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hub .hub-sched-head h2{font-size:24px;margin:8px 0 0}
.hub .hub-daynav{display:flex;gap:6px;align-items:center}
.hub .hub-arrow{width:34px;height:34px;border:1px solid var(--h-line);background:transparent;border-radius:8px;font-size:14px;color:var(--h-ink);transition:border-color .15s}
.hub .hub-arrow:hover{border-color:var(--h-turq)}
.hub .hub-arrow:disabled{opacity:.3;cursor:default;border-color:var(--h-line)}
.hub .hub-slots{padding:6px 28px 18px}
.hub .hub-slot{display:grid;grid-template-columns:78px 1fr;min-height:60px;border-bottom:1px solid var(--h-line2)}
.hub .hub-slot:last-child{border-bottom:0}
.hub .hub-slot time{font-family:var(--h-mono);font-size:11.5px;color:var(--h-muted);padding-top:17px}
.hub .hub-slot.now time{color:var(--h-teal)}
.hub .hub-block{display:block;width:100%;text-align:left;margin:7px 0;padding:12px 14px;border:0;border-left:3px solid var(--h-strong);background:var(--h-panel2);border-radius:0 8px 8px 0;color:var(--h-ink);font-family:var(--h-body)}
.hub button.hub-block:hover{filter:brightness(1.12)}
html.light .hub button.hub-block:hover{filter:brightness(.97)}
.hub .hub-block b{display:block;font-size:14px;font-weight:600}
.hub .hub-block small{color:var(--h-muted);font-size:12px}
.hub .hub-deadline{border-color:var(--h-turq)!important;background:var(--h-dead-bg)!important}
.hub .hub-program{border-color:var(--h-class)!important;background:var(--h-class-bg)!important}
.hub .hub-vendor{border-color:var(--h-vend)!important;background:var(--h-vend-bg)!important}
.hub .hub-meeting{border-color:var(--h-meet)!important;background:var(--h-meet-bg)!important}
.hub .hub-blocknote{margin-top:10px;padding-top:10px;border-top:1px solid var(--h-line);font-size:13px;color:var(--h-ink2);line-height:1.5}
.hub .hub-blocknote b{font-family:var(--h-mono);font-weight:500;color:var(--h-muted)}
.hub .hub-blocknote ul{margin:6px 0 0;padding-left:16px;display:grid;gap:3px}
.hub .hub-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 28px 16px;font-size:12px;color:var(--h-muted);font-family:var(--h-mono);letter-spacing:.04em}
.hub .hub-legend span{display:inline-flex;align-items:center;gap:7px}
.hub .hub-legend i{width:10px;height:10px;border-radius:3px;display:block}
.hub .hub-sched-actions{display:flex;gap:8px;padding:0 28px 22px;flex-wrap:wrap}
.hub .hub-ghost{border:1px solid var(--h-line);background:transparent;border-radius:999px;min-height:38px;padding:0 14px;font-size:13px;font-weight:600;color:var(--h-ink);transition:border-color .15s ease,background-color .15s ease,color .15s ease}
.hub .hub-ghost:hover{border-color:var(--h-turq);background:var(--h-panel2)}
.hub .hub-ghost[aria-pressed="true"]{background:var(--h-swap);border-color:var(--h-swap);color:var(--h-swap-ink)}

/* Right column */
.hub .hub-item{padding:16px 0;border-top:1px solid var(--h-line)}
.hub .hub-item:first-of-type{border-top:0;padding-top:0}
.hub .hub-item b{font-size:14.5px;font-weight:600}
.hub .hub-item p{color:var(--h-muted);font-size:13px;line-height:1.5;margin:6px 0 12px}
.hub .hub-when{float:right;color:var(--h-teal);font-family:var(--h-mono);font-size:11px;letter-spacing:.08em}
.hub .hub-mini{display:flex;gap:8px;flex-wrap:wrap}
.hub .hub-mini button{border:1px solid var(--h-line);background:transparent;color:var(--h-ink);min-height:32px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;transition:border-color .15s,background-color .15s,color .15s}
.hub .hub-mini button:hover{border-color:var(--h-ink)}
.hub .hub-mini .hub-send{background:var(--h-accent);border-color:var(--h-accent);color:var(--h-on-accent)}
.hub .hub-mini .hub-send:hover{background:var(--h-swap);border-color:var(--h-swap);color:var(--h-swap-ink)}
.hub .hub-event{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid var(--h-line);align-items:center;font-size:13.5px}
.hub .hub-event:first-child{border-top:0}
.hub .hub-event time{color:var(--h-muted);font-family:var(--h-mono);font-size:11.5px}
.hub .hub-trustline{display:flex;gap:10px;align-items:center;color:var(--h-muted);font-size:13px;margin-top:18px;line-height:1.5}
.hub .hub-trustline i{width:6px;height:6px;flex:none;background:var(--h-turq);border-radius:50%;box-shadow:0 0 0 5px rgba(45,212,191,.12)}

/* Calendar page */
.hub .hub-weekwrap{overflow-x:auto;border:1px solid var(--h-line);border-radius:18px;background:var(--h-panel);box-shadow:var(--h-shadow)}
.hub .hub-week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.hub .hub-wcol{border-right:1px solid var(--h-line);min-height:440px}
.hub .hub-wcol:last-child{border-right:0}
.hub .hub-whead{padding:16px 14px 14px;display:grid;gap:4px;color:var(--h-ink);font-family:var(--h-body);border-bottom:1px solid var(--h-line)!important}
.hub .hub-whead b{font-size:15px;font-weight:600}
.hub .hub-whead.today{background:var(--h-teal-soft)!important}
.hub .hub-whead.today .hub-eyebrow,.hub .hub-whead.today b{color:var(--h-teal)}
.hub .hub-wbody{padding:8px 10px;display:grid;gap:2px;align-content:start}
.hub .hub-wbody .hub-block{margin:3px 0}
.hub .hub-wbody time{display:block;font-family:var(--h-mono);font-size:11px;color:var(--h-muted);margin:8px 0 3px}

/* Tables and forms */
.hub .hub-table{margin-top:18px;border:1px solid var(--h-line);border-radius:18px;overflow:hidden;background:var(--h-panel);box-shadow:var(--h-shadow)}
.hub .hub-row{display:grid;grid-template-columns:1fr 160px 170px 150px;gap:16px;padding:18px 24px;border-bottom:1px solid var(--h-line);align-items:center;transition:background-color .15s}
.hub .hub-row:hover{background:var(--h-panel2)}
.hub .hub-row:last-child{border-bottom:0}
.hub .hub-row b{font-size:15px;font-weight:600}
.hub .hub-row small{display:block;color:var(--h-muted);margin-top:4px;font-size:13px;line-height:1.5}
.hub .hub-state{font-family:var(--h-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--h-teal)}
.hub .hub-state.hub-open{color:var(--h-warn)}
.hub .hub-meta{font-size:13.5px;color:var(--h-muted);line-height:1.45;font-variant-numeric:tabular-nums}
.hub .hub-rowact{justify-self:end}
.hub .hub-form{display:grid;grid-template-columns:2fr 2fr 1fr 1fr auto;gap:10px;align-items:end;padding:18px 24px;border-top:1px solid var(--h-line);background:var(--h-panel2)}
.hub label{display:grid;gap:7px;font-family:var(--h-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--h-muted)}

function useGoogleCalendar(){
  const [data,setData]=useState({loading:true,connected:false,selected:[],events:[],error:'',syncedAt:null});
  const [period,setPeriod]=useState(0),[revision,setRevision]=useState(0);
  const date=new Date();date.setHours(0,0,0,0);date.setDate(date.getDate()+period*7);
  const start=date.toISOString();date.setDate(date.getDate()+7);const end=date.toISOString();
  useEffect(()=>{
    let stopped=false,inFlight=false;const controller=new AbortController();
    const run=async()=>{
      if(inFlight || document.hidden)return;inFlight=true;
      setData(d=>({...d,loading:true,error:'',events:[],syncedAt:null}));
      try{
        const state=await googleApi('status',{},undefined,controller.signal);
        const ev=state.connected&&state.selected.length?await googleApi('events',{start,end},undefined,controller.signal):{events:[],syncedAt:null};
        if(!stopped)setData({...state,...ev,loading:false,error:''});
      }catch(e){if(!stopped)setData(d=>({...d,loading:false,events:[],syncedAt:null,error:e.message}));}
      finally{inFlight=false;}
    };
    run();const timer=setInterval(run,60000);const visible=()=>{if(!document.hidden)run()};document.addEventListener('visibilitychange',visible);
    return()=>{stopped=true;controller.abort();clearInterval(timer);document.removeEventListener('visibilitychange',visible)};
  },[start,end,revision]);
  return {...data,start,end,period,setPeriod,refresh:()=>setRevision(n=>n+1)};
}

function GoogleConnect({s,close,done}){
  const [calendars,setCalendars]=useState([]),[ids,setIds]=useState([]),[busy,setBusy]=useState(false),[error,setError]=useState('');
  const [ready,setReady]=useState(false);const g=s.google;
  useEffect(()=>{
    if(!g.connected)return;let stopped=false;const controller=new AbortController();setBusy(true);
    googleApi('calendars',{},undefined,controller.signal).then(d=>{if(!stopped){setCalendars(d.calendars);setIds(d.selected.length?d.selected.map(c=>c.id):d.calendars.filter(c=>c.primary).map(c=>c.id));setReady(true)}}).catch(e=>{if(!stopped)setError(e.message)}).finally(()=>{if(!stopped)setBusy(false)});
    return()=>{stopped=true;controller.abort()};
  },[g.connected]);
  const act=async(action,payload)=>{setBusy(true);setError('');try{await googleApi(action,{},payload);g.refresh();if(action==='select'&&done)done();else close()}catch(e){setError(e.message)}finally{setBusy(false)}};
  return html`<div class="hub-overlay" role="dialog" aria-modal="true" aria-labelledby="google-title" onClick=${e=>{if(e.target===e.currentTarget&&!busy)close()}}><div class="hub-modal">
    <div class="hub-modal-head"><h2 id="google-title">Connect Google Calendar</h2><button class="hub-x" aria-label="Close" onClick=${close}>×</button></div>
    <div class="hub-modal-body"><p>Read-only access. CUEPA cannot create, edit or delete your Google events.</p><p>Your selected events are visible only to your CUEPA login in this workspace.</p>
      ${error&&html`<p class="hub-warnnote" role="alert">${error}</p>`}
      ${g.connected?html`<p>Choose up to 10 calendars. We checked your main one for you.</p>
        ${busy&&html`<p role="status">Loading…</p>`}
        <div class="hub-opts">${calendars.map(c=>html`<label class="hub-opt" key=${c.id}><input type="checkbox" checked=${ids.includes(c.id)} disabled=${busy||(!ids.includes(c.id)&&ids.length>=10)} onChange=${()=>setIds(old=>old.includes(c.id)?old.filter(x=>x!==c.id):[...old,c.id])}/>${c.name}${c.primary?' (primary)':''}</label>`)}</div>
        ${ready&&!calendars.length&&html`<p>No readable calendars were found for this Google account.</p>`}
        <p class="hub-sub">Disconnect removes this connection from CUEPA. You can also remove CUEPA access in your Google Account permissions.</p>`:html`<p>Google will ask you to choose an account and approve Calendar access. Then you can select calendars here.</p><div class="hub-remind-note">Heads up: Google may say it hasn’t verified CUEPA yet while we finish their review. Click <b>Advanced</b>, then <b>Go to CUEPA</b>. It’s safe, and CUEPA can only read your calendar.</div>`}
      <p class="hub-sub">Outlook and Apple Calendar are not connected in this version.</p>
    </div>
    <div class="hub-modal-actions">
      ${g.connected?html`<button class="hub-ghost" disabled=${busy} onClick=${()=>act('disconnect',{})}>Disconnect</button><a class="hub-ghost" href=${googleUrl('start')}>Reconnect Google</a><button class="hub-primary" disabled=${busy||!ready} onClick=${()=>act('select',{ids})}>Save calendars</button>`:html`<a class="hub-primary" href=${googleUrl('start')}>Continue with Google</a>`}
    </div>
  </div></div>`;
}

function App(){
  const [base,setS]=useState(load);
  const google=useGoogleCalendar();
  const tc=useTimecards();
  const s={...base,google,conn:{...base.conn,calendar:{status:google.connected?'connected':'none',tool:'Google Calendar'}}};
  const [toast,setToast]=useState("");
  const [modal,setModal]=useState(null);
  const [conn,setConn]=useState(null);
  useEffect(()=>{
    const url=new URL(location.href), result=url.searchParams.get('google');
    if(result){setToast(result==='connected'?'Google connected. Choose your calendars.':result==='cancelled'?'Google connection cancelled.':'Could not connect Google. Please try again.');setS(p=>({...p,view:'connect'}));if(result==='connected')setConn('calendar');url.searchParams.delete('google');history.replaceState(null,'',url.pathname+url.search+url.hash)}
  },[]);
  const timer=useRef(null);
  const [lib,setLib]=useState(false);
  const libRef=useRef(null);
  const [look,setLook]=useState(()=>document.documentElement.classList.contains("light")?"light":"dark");
  const flip=()=>{const n=look==="light"?"dark":"light";document.documentElement.classList.toggle("light",n==="light");try{localStorage.setItem("cuepa_look",n)}catch(e){}setLook(n)};
  useEffect(()=>{if(!lib)return;const c=e=>{if(libRef.current&&!libRef.current.contains(e.target))setLib(false)};const k=e=>{if(e.key==="Escape")setLib(false)};document.addEventListener("mousedown",c);document.addEventListener("keydown",k);return()=>{document.removeEventListener("mousedown",c);document.removeEventListener("keydown",k)}},[lib]);
  useEffect(()=>save(base),[base]);
  useEffect(()=>{const sync=()=>{const h=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h))setS(p=>({...p,view:h}))};sync();window.addEventListener("hashchange",sync);return()=>window.removeEventListener("hashchange",sync)},[]);
  useEffect(()=>{if(!modal&&!conn)return;const k=e=>{if(e.key==="Escape"){setModal(null);setConn(null)}};document.addEventListener("keydown",k);return()=>document.removeEventListener("keydown",k)},[modal,conn]);
  const say=m=>{setToast(m);clearTimeout(timer.current);timer.current=setTimeout(()=>setToast(""),3200)};
  const up=(fn,msg,log)=>{setS(p=>{const n=clone(p);fn(n);if(log)n.feed.unshift([now(),log[0],log[1]]);return n});if(msg)say(msg)};
  const go=v=>{setS(p=>({...p,view:v}));location.hash=v;window.scrollTo({top:0,behavior:"auto"})};

  if(!s.signedIn) return html`<div class="hub-signin"><form onSubmit=${e=>{e.preventDefault();up(n=>{n.signedIn=true})}}>
    <span style=${{display:"flex",gap:"10px",alignItems:"center",fontWeight:700,letterSpacing:".13em",fontSize:"13px"}}><span style=${{display:"inline-flex",gap:"3px"}}><i style=${{width:9,height:9,borderRadius:"50%",background:"#101516",display:"block"}}></i><i style=${{width:9,height:9,borderRadius:"50%",background:"#2dd4bf",display:"block"}}></i></span>CUEPA</span>
    <h1>Welcome back<span class="dot">.</span></h1><p style=${{margin:0,color:"var(--h-muted)"}}>Sign in to the Cirques Experience workspace.</p>
    <label style=${{display:"grid",gap:"6px",fontSize:"12px",fontWeight:700,color:"var(--h-muted)"}}>Email<input id="email" type="email" defaultValue="christian@cirquesexperience.org"/></label>
    <button type="submit">Sign in</button><small style=${{color:"var(--h-muted)"}}>Sample sign-in · any entry works</small></form></div>`;

  const needs=buildNeeds(s,up,go,setModal);
  const open=needs.filter(n=>!n.done).length;
  const notSet=setupSteps(s,tc).filter(x=>!x.done).length;
  const live=CONNS.filter(c=>s.conn[c.id].status==="connected").length;
  const counts={connect:notSet,today:open,timecards:tc.team.filter(m=>{const c=tc.cards[m.id];return !c||c.status!=="approved"}).length,vendors:s.vendors.filter(v=>v.status==="needs").length,meetings:s.meetings.reduce((a,m)=>a+m.actions.filter(x=>!x.d).length,0)};
  const label=VIEWS.find(v=>v[0]===s.view)[1];
  const V={today:Today,calendar:Calendar,timecards:Timecards,vendors:Vendors,meetings:Meetings,access:Access,connect:Setup}[s.view];
  const draftsLeft=s.drafts.filter(d=>d.status==="draft");

  return html`<div class="hub">
    <header class="hub-bar"><div class="hub-bar-in">
      <div class="hub-brand"><span class="hub-mark" aria-hidden="true"><i></i><i></i></span><span class="hub-wm">CUEPA</span><span class="hub-sep" aria-hidden="true"></span>${BLANK?html`<span class="hub-wsname">Cirques Experience</span>`:html`<span class="hub-cx" role="img" aria-label="Cirques Experience"><svg width="30" height="26" viewBox="0 0 60 52" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><ellipse cx="24" cy="26" rx="15" ry="22"/><ellipse cx="36" cy="26" rx="15" ry="22"/><path d="M24 4 L36 4"/><path d="M24 48 L36 48"/><path d="M9 26 L21 26"/><path d="M39 26 L51 26"/><path d="M13 11 L25 11"/><path d="M35 41 L47 41"/></g></svg><span class="hub-cx-a">Cirques</span><span class="hub-cx-b">Experience</span></span>`}</div>
      <div class="hub-tools">
        <nav class="hub-lib" aria-label="Library" ref=${libRef}>
          <button type="button" class="hub-libbtn" aria-expanded=${lib} aria-controls="hub-libmenu" onClick=${()=>setLib(!lib)}><span class="hub-libk">Library</span><span class="hub-libcur">${label}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          ${lib&&html`<div class="hub-libmenu" id="hub-libmenu">
            ${VIEWS.map(([k,l])=>html`<button key=${k} type="button" aria-current=${s.view===k?"page":undefined} onClick=${()=>{setLib(false);go(k)}}><span>${l}</span>${counts[k]?html`<span class="hub-count">${counts[k]}</span>`:s.view===k?html`<span class="hub-cur"></span>`:null}</button>`)}
            <div class="hub-libacct">
              <div class="hub-user"><span class="hub-avatar" aria-hidden="true">CO</span><span><b style=${{color:"#101516"}}>Christian Ochsner</b><br/>Owner</span></div>
              <div class="hub-acctlinks"><button class="hub-link" onClick=${()=>up(n=>{n.signedIn=false})}>Sign out</button><button class="hub-link" onClick=${()=>{setS(clone(SEED));say("Sample data reset.")}}>Reset sample data</button></div>
            </div>
          </div>`}
        </nav>
        <button type="button" class="hub-mode" aria-pressed=${look==="light"} onClick=${flip}>${look==="light"?"Dark mode":"Light mode"}</button>
      </div>
    </div></header>
    <main class="hub-content">
      <div class="hub-actions">
        <span class="hub-crumb">app.makingcuepa.com / ${label.toLowerCase()}</span>
        <div class="hub-top-right">
          <span class="hub-badge"><i aria-hidden="true"></i>${live?`${live} of ${CONNS.length} connected`:BLANK?"Nothing connected yet":"Sample data · nothing connected"}</span>
          <button type="button" class="hub-primary" disabled=${!draftsLeft.length} onClick=${()=>setModal(draftsLeft[0].id)}>${draftsLeft.length?`Review drafted reminders (${draftsLeft.length})`:BLANK&&!s.drafts.length?"No reminders yet":"All drafts reviewed"}</button>
        </div>
      </div>
      <${V} key=${s.view} s=${s} up=${up} go=${go} needs=${needs} open=${open} setModal=${setModal} say=${say} openC=${setConn} tc=${tc}/>
    </main>
    ${modal&&html`<${Review} d=${s.drafts.find(x=>x.id===modal)} close=${()=>setModal(null)} up=${up}/>`}
    ${conn&&html`<${conn==="calendar"?GoogleConnect:conn==="quickbooks"?QuickBooksModal:Connect} key=${conn} c=${CONNS.find(x=>x.id===conn)} s=${s} up=${up} close=${()=>setConn(null)} done=${()=>{setConn(null);go("today");say("Your calendar is in. Here’s your day.")}}/>`}
    <div class=${"hub-toast"+(toast?" hub-show":"")} role="status" aria-live="polite">${toast}</div>
  </div>`;
}

function buildNeeds(s,up,go,setModal){
  if(BLANK) return [];
  const rig=s.vendors.find(v=>v.id==="v1");
  return [
    {t:"Confirm the payroll submission date",d:"Payroll submits Thursday, Oct 15 at 9 AM, the morning after the parent advisory meeting.",
     done:s.payroll!=="open",btns:[["Keep Thursday",()=>up(n=>{n.payroll="thu"},"Payroll stays on Thursday.",["You kept payroll on Thu Oct 15","CONFIRMED"]),true],["Move to Wednesday",()=>up(n=>{n.payroll="wed"},"Payroll moved to Wednesday, Oct 14.",["You moved payroll to Wed Oct 14","CHANGED"])]],
     doneText:s.payroll==="wed"?"Handled ✓ Moved to Wednesday":"Handled ✓ Thursday confirmed"},
    {t:"Assign someone to the rig inspection",d:"Summit Rigging needs a date before Oct 14. It came up at last week's check-in and no one has it yet.",
     done:rig.status!=="needs",btns:[["I'll handle it",()=>up(n=>{const v=n.vendors.find(x=>x.id==="v1");v.status="open";v.owner="Christian"},"The rig inspection is yours.",["You took the rig inspection","ASSIGNED"]),true],["Give it to Ana",()=>up(n=>{const v=n.vendors.find(x=>x.id==="v1");v.status="open";v.owner="Ana V."},"Assigned to Ana.",["Rig inspection assigned to Ana","ASSIGNED"])]],
     doneText:`Handled ✓ ${rig.owner||"Assigned"}`}
  ];
}

  const steps=setupSteps(s,tc),setUp=steps.filter(x=>x.done).length;
  return html`<section>
    <div class="hub-hello">
      <div><span class="hub-eyebrow">${BLANK?new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}).replace(", "," · "):"Friday · October 9"}</span>
        <h1>${BLANK?"Welcome. Let’s set up your hub":open?"Here’s what needs you":"You’re all caught up"}<span class="dot">.</span></h1>
        <p>${BLANK?"Connect your calendar, your email and the tools you already use. As soon as they’re connected, this page shows your real day: what needs you, what’s coming up, and what we’ve prepared for you.":open?`${open===1?"One thing needs":`${["","One","Two","Three"][open]} things need`} a decision from you. Everything else is being tracked in one place instead of across separate systems.`:"Nothing needs a decision right now. Your day is below."}</p></div>
      <div class="hub-status">${BLANK?"First step":"Next up"}<b>● ${BLANK?"Connect your calendar":"11:00 AM · Weekly ops check-in"}</b></div>
    </div>
    ${setUp<steps.length&&html`<div class="hub-notice">
      <div style=${{flex:"1 1 320px"}}><span class="hub-notice-k">${setUp?"ALMOST THERE":BLANK?"LET'S GET YOU SET UP":"YOU'RE LOOKING AT SAMPLE DATA"}</span>
        <p>Connect your calendar, your email and the tools you already use, and this page fills in with your real day. ${setUp} of ${steps.length} set up.</p>
        <div class="hub-prog"><i style=${{width:`${setUp/steps.length*100}%`}}></i></div></div>
      <div class="hub-btns">${s.conn.calendar.status==="none"
        ?html`<button type="button" class="hub-primary" onClick=${()=>openC("calendar")}>Connect your calendar</button><button type="button" class="hub-ghost" onClick=${()=>go("connect")}>See setup steps</button>`
        :html`<button type="button" class="hub-primary" onClick=${()=>go("connect")}>Continue setup</button>`}</div>
    </div>`}
    <div class="hub-grid">
      <div class="hub-col hub-col-1">
        <div class="hub-card hub-needs">
          <div class="hub-card-title"><div><span class="hub-eyebrow">Ready for your decision</span><h2>What needs you today.</h2></div></div>
          ${needs.map((n,i)=>html`<div class=${"hub-need"+(n.done?" done":"")} key=${i}>
            <span class="hub-need-num" aria-hidden="true">${n.done?"✓":String(i+1).padStart(2,"0")}</span>
            <div><b>${n.t}</b><p>${n.d}</p>
              ${n.done?html`<div class="hub-done">${n.doneText}</div>`:html`<div class="hub-btns">${n.btns.map(([l,fn,p])=>html`<button key=${l} type="button" class=${"hub-pill"+(p?" hub-go":"")} onClick=${fn}>${l}</button>`)}</div>`}
            </div></div>`)}
          ${!needs.length&&html`<p class="hub-empty">Nothing needs a decision yet. Once your tools are connected, the things that need you show up here.</p>`}
        </div>
      </div>
      <div class="hub-col hub-col-2"><${DayCard} s=${s} up=${up} go=${go} openC=${openC}/></div>
      <div class="hub-col hub-col-3">
        <div class="hub-card hub-invert">
          <div class="hub-card-title"><div><span class="hub-eyebrow">Prepared for you</span><h3>Drafted reminders</h3></div><span class="hub-tag">NOT SENT</span></div>
          <${Src} s=${s} id="email" openC=${openC} label="Connect your email" inline=${true}/>
          ${!s.drafts.length&&html`<p class="hub-empty in">No reminders yet. When something needs a follow-up, we draft it here for you to approve.</p>`}
          ${s.drafts.map(d=>html`<div class="hub-item" key=${d.id} style=${d.status==="aside"?{opacity:.45}:undefined}>
            <span class="hub-when">${d.status==="approved"?"✓ SCHEDULED":d.status==="aside"?"SET ASIDE":d.when}</span>
            <b>${d.title}</b><p>To ${d.to}.</p>
            ${d.status==="draft"?html`<div class="hub-mini">
              <button type="button" class="hub-send" onClick=${()=>setModal(d.id)}>Review & send</button>
              <button type="button" onClick=${()=>up(n=>{n.drafts.find(x=>x.id===d.id).status="aside"},"Set aside. Nothing was sent.")}>Set aside</button></div>`
            :d.status==="aside"?html`<div class="hub-mini"><button type="button" onClick=${()=>up(n=>{n.drafts.find(x=>x.id===d.id).status="draft"})}>Bring back</button></div>`:null}
          </div>`)}
        </div>
        <div class="hub-card">
          <div class="hub-card-title"><div><span class="hub-eyebrow">Activity</span><h3>What the hub did today</h3></div></div>
          ${!s.feed.length&&html`<p class="hub-empty in">Nothing yet. Everything the hub prepares or flags for you is listed here.</p>`}<div>${s.feed.slice(0,5).map(([t,w,tag],i)=>html`<div class="hub-event" key=${i}><time>${t}</time><span>${w}</span><span class="hub-tag">${tag}</span></div>`)}</div>
          <div class="hub-trustline"><i aria-hidden="true"></i><span>Preparing and flagging happen automatically. Sending and approving stay with a person.</span></div>
        </div>
      </div>
    </div>

  const add=e=>{e.preventDefault();if(!f.name.trim())return;up(n=>{n.vendors.unshift({id:"v"+Date.now(),...f,amount:f.amount||"—",due:f.due||"—",status:"open"})},`${f.name} added.`,[`Vendor added: ${f.name}`,"ADDED"]);setF({name:"",item:"",due:"",amount:""})};
  return html`<section>
    <div class="hub-pagehead"><span class="hub-eyebrow">03 — Follow through</span><h1>Vendors and payments<span class="dot">.</span></h1>
      <p>Bills, inspections and renewals in one list, with who is handling each one, so nothing depends on someone remembering it.</p></div>
    <${Src} s=${s} id="books" openC=${openC} label="Connect accounting & bills" inline=${true}/>

      <div><b>${v.name}</b><small>${v.item}${v.owner?` · ${v.owner}`:""}</small></div><span class="hub-meta">Due ${v.due} · ${v.amount}</span><span class=${"hub-state "+x[1]}>${x[0]}</span>
      <span class="hub-rowact">${v.status==="needs"?html`<button class="hub-pill hub-go" onClick=${()=>up(n=>{const y=n.vendors.find(z=>z.id===v.id);y.status="open";y.owner="Christian"},"It's yours.",[`You took ${v.name}`,"ASSIGNED"])}>I'll handle it</button>`
        :v.status==="open"?html`<button class="hub-pill" onClick=${()=>up(n=>{n.vendors.find(z=>z.id===v.id).status="paid"},`${v.name} marked paid.`,[`${v.name} marked paid`,"PAID"])}>Mark paid</button>`:null}</span>

  </section>`;
}

    <div class="hub-card-title" style=${{margin:0}}><div><span class="hub-eyebrow">${m.when}</span><h3>${m.title}</h3><small style=${{color:"var(--h-muted)"}}>With ${m.with}</small></div></div>

      <input type="checkbox" id=${m.id+"-a"+i} checked=${a.d} onChange=${()=>up(n=>{const x=n.meetings.find(y=>y.id===m.id).actions[i];x.d=!x.d})}/><span>${a.t}</span></label>`)}</div>

}

}

function Src({s,id,openC,label,inline}){
  const c=s.conn[id];
  const cls="hub-src"+(inline?" inline":"")+(c.status==="connected"?" on":"");
  if(id==="calendar")return html`<div class=${cls}><span>${s.google.error?'Calendar needs attention':s.google.connected?'Google Calendar connected':'Google Calendar not connected'}</span><button class="hub-linkbtn" onClick=${()=>openC('calendar')}>${s.google.connected?'Manage calendars':'Connect calendar'} →</button></div>`;
  if(c.status==="connected")return html`<div class=${cls}><i class="hub-dot"></i><span>${id==="team"?"Your team has been invited":`Connected · ${c.tool} · synced just now`}</span></div>`;
  if(c.status==="requested")return html`<div class=${cls}><i class="hub-dot"></i><span>${BLANK?"Requested":"Sample data"} · ${id==="team"?"Invites requested":`We'll connect ${c.tool} with you`}</span></div>`;
  return html`<div class=${cls}><i class="hub-dot"></i><span>${BLANK?"Not connected yet":"Sample data"}</span><button type="button" class="hub-linkbtn" onClick=${()=>openC(id)}>${label} →</button></div>`;
}

function statusTag(st,c){
  if(st.status==="connected")return html`<span class="hub-tag">✓ ${c.mode==="invite"?"INVITED":"CONNECTED"}</span>`;
  if(st.status==="requested")return html`<span class="hub-tag hub-tag-warn">◌ WAITING ON CUEPA</span>`;
  return html`<span class="hub-tag hub-tag-quiet">NOT SET UP</span>`;
}
function Connect({c,s,up,close}){
  const cur=s.conn[c.id];
  const [step,setStep]=useState(c.mode==="invite"?"invite":"pick");
  const [tool,setTool]=useState(cur.tool&&c.tools.includes(cur.tool)?cur.tool:c.tools[0]);
  const [cals,setCals]=useState({"Studio":true,"Class schedule":true,"Payroll deadlines":true,"Personal":false});
  const [who,setWho]=useState("me");
  const [f,setF]=useState({other:"",name:"",email:"",reach:"",note:"",role:"Program lead"});
  const ref=useRef(null);
  useEffect(()=>{ref.current&&ref.current.focus()},[]);
  const provider=/Google|Gmail/.test(tool)?"Google":/Outlook|Microsoft/.test(tool)?"Microsoft":"Apple";
  const SENT="Saved. Your email app opened with the details. Press send so Marcos gets them.";
  const finishSelf=()=>{
    const picked=c.id==="calendar"?Object.keys(cals).filter(k=>cals[k]):[];
    mailCUEPA(`Cirques hub: ${c.name} (${tool})`,[`We use: ${tool}`,...(picked.length?[`Calendars to include: ${picked.join(", ")}`]:[]),"","Please connect this for our hub."]);
    up(n=>{n.conn[c.id]={status:"requested",tool}},SENT,[`${c.name}: ${tool} noted`,"REQUESTED"]);close()};
  const finishAssist=e=>{e.preventDefault();const t=tool==="Something else"?(f.other.trim()||"Another tool"):tool;
    mailCUEPA(`Cirques hub: ${c.name} (${t})`,[`We use: ${t}`,`Who has the login: ${who==="me"?"Me":`${f.name||"(name)"} ${f.email?`<${f.email}>`:""}`}`,`Best way to reach me: ${f.reach||"(not given)"}`,...(f.note?["",`Notes: ${f.note}`]:[])]);
    up(n=>{n.conn[c.id]={status:"requested",tool:t}},SENT,[`Setup requested: ${c.name} (${t})`,"REQUESTED"]);close()};
  const invite=e=>{e.preventDefault();if(!f.name.trim()||!f.email.trim())return;
    mailCUEPA("Cirques hub: please invite a team member",[`Name: ${f.name.trim()}`,`Email: ${f.email.trim()}`,`Role: ${f.role}`]);
    up(n=>{n.people.push({id:"u"+Date.now(),name:f.name.trim(),role:`${f.role} · invite requested`,fin:false});n.conn.team={status:"requested",tool:"Invites"}},SENT,[`Invite requested for ${f.name.trim()}`,"REQUESTED"]);
    setF({...f,name:"",email:""})};
  const title={self:`Connect your ${c.name.toLowerCase()}`,assist:`Set up ${c.name.toLowerCase()}`,invite:"Invite your team"}[c.mode];
  const total=c.id==="calendar"?3:2;
  const stepNo={pick:1,signin:2,cals:3,details:2}[step];

  let body,actions;
  if(step==="pick"){
    body=html`<span class="hub-eyebrow">Which one do you use?</span>
      <div class="hub-opts">${c.tools.map(t=>html`<label class="hub-opt" key=${t}><input type="radio" name=${"tool-"+c.id} id=${"tool-"+c.id+"-"+t.replace(/\W/g,"")} checked=${tool===t} onChange=${()=>setTool(t)}/>${t}</label>`)}</div>`;
    actions=html`<button type="button" class="hub-ghost" onClick=${close}>Cancel</button><button type="button" class="hub-primary" onClick=${()=>setStep(c.mode==="self"?"signin":"details")}>Next</button>`;
  }else if(step==="signin"){
    body=html`<div class="hub-fgrid" style=${{justifyItems:"start"}}>
      <div class="hub-warnnote">Your live hub is still being set up, so this won't sign you in yet. Save your choice and we'll connect ${tool} with you.</div>
      <p class="hub-sub" style=${{fontSize:"14px"}}>When it's live, you'll sign in on ${provider}'s own page and come right back here. CUEPA never sees your password, and you can disconnect at any time.</p>
      <button type="button" class="hub-primary" style=${{fontSize:"14px",padding:"14px 22px"}} onClick=${()=>c.id==="calendar"?setStep("cals"):finishSelf()}>${c.id==="calendar"?"Next: choose calendars":"Save my choice"}</button>
      <small class="hub-feeds">${c.id==="calendar"?"READ-ONLY: THE HUB SEES YOUR EVENTS BUT CAN'T CHANGE THEM.":"THE HUB DRAFTS EMAILS. IT NEVER SENDS WITHOUT YOUR OK."}</small></div>`;
    actions=html`<button type="button" class="hub-ghost" onClick=${()=>setStep("pick")}>Back</button>`;
  }else if(step==="cals"){
    body=html`<span class="hub-eyebrow">Which calendars should show up in the hub?</span>
      <div class="hub-opts">${Object.keys(cals).map(k=>html`<label class="hub-opt" key=${k}><input type="checkbox" id=${"cal-"+k.replace(/\W/g,"")} checked=${cals[k]} onChange=${()=>setCals({...cals,[k]:!cals[k]})}/>${k}</label>`)}</div>
      <p class="hub-sub" style=${{marginTop:"12px"}}>Your personal calendar is off by default. Turn it on only if you want personal events next to work.</p>`;
    actions=html`<button type="button" class="hub-ghost" onClick=${()=>setStep("signin")}>Back</button><button type="button" class="hub-primary" disabled=${!Object.values(cals).some(Boolean)} onClick=${finishSelf}>Save my choice</button>`;
  }else if(step==="details"){
    body=html`<form id="assist-form" class="hub-fgrid" onSubmit=${finishAssist}>
      ${tool==="Something else"&&html`<label>What's it called?<input id="other-tool" value=${f.other} onInput=${e=>setF({...f,other:e.target.value})} placeholder="Name of the tool"/></label>`}
      <div><span class="hub-eyebrow">Who has the login for ${tool==="Something else"?"it":tool}?</span>
        <div class="hub-opts">${[["me","I do"],["other","Someone else on the team"]].map(([k,l])=>html`<label class="hub-opt" key=${k}><input type="radio" name="who" id=${"who-"+k} checked=${who===k} onChange=${()=>setWho(k)}/>${l}</label>`)}</div></div>
      ${who==="other"&&html`<div class="hub-form2"><label>Their name<input id="who-name" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/></label><label>Their email<input id="who-email" type="email" value=${f.email} onInput=${e=>setF({...f,email:e.target.value})}/></label></div>`}
      <label>Best way to reach you<input id="reach" value=${f.reach} onInput=${e=>setF({...f,reach:e.target.value})} placeholder="Phone or email"/></label>
      <label>Anything we should know? (optional)<textarea id="note" value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="For example: we only use it for payroll, not scheduling."></textarea></label>
      <div class="hub-warnnote">We'll set this up with you on a short call. Please don't type passwords here.</div>
    </form>`;
    actions=html`<button type="button" class="hub-ghost" onClick=${()=>setStep("pick")}>Back</button><button type="submit" form="assist-form" class="hub-primary">Send to CUEPA</button>`;
  }else{
    body=html`<form id="invite-form" class="hub-fgrid" onSubmit=${invite}>
      <div class="hub-form2"><label>Name<input id="inv-name" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})} placeholder="Ana Vargas"/></label>
        <label>Email<input id="inv-email" type="email" value=${f.email} onInput=${e=>setF({...f,email:e.target.value})} placeholder="ana@cirquesexperience.org"/></label></div>
      <label>Role<select id="inv-role" value=${f.role} onChange=${e=>setF({...f,role:e.target.value})}>${["Program lead","Front desk","Instructor","Bookkeeper"].map(r=>html`<option key=${r}>${r}</option>`)}</select></label>
      <p class="hub-sub">When your hub is live, they'll get an email to create their own login. You choose what they can see on the Access page.</p>
      <button type="submit" class="hub-primary" style=${{justifySelf:"start"}}>Request invite</button>
    </form>`;
    actions=html`<button type="button" class="hub-ghost" onClick=${close}>Done</button>`;
  }
  return html`<div class="hub-overlay" role="dialog" aria-modal="true" aria-labelledby="hub-conn-title" onClick=${e=>{if(e.target===e.currentTarget)close()}}>
    <div class="hub-modal">
      <div class="hub-modal-head"><div><span class="hub-eyebrow">${MODE[c.mode]}${stepNo?` · Step ${stepNo} of ${c.mode==="assist"?2:total}`:""}</span><h2 id="hub-conn-title">${title}</h2></div>
        <button type="button" class="hub-x" ref=${ref} aria-label="Close" onClick=${close}>×</button></div>
      <div class="hub-modal-body">${body}</div>
      <div class="hub-modal-actions">${actions}</div>
    </div>
  </div>`;
}

function Review({d,close,up}){
  const ref=useRef(null);
  useEffect(()=>{ref.current&&ref.current.focus()},[]);
  return html`<div class="hub-overlay" role="dialog" aria-modal="true" aria-labelledby="hub-modal-title" onClick=${e=>{if(e.target===e.currentTarget)close()}}>
    <div class="hub-modal">
      <div class="hub-modal-head"><div><span class="hub-eyebrow">Nothing is sent without you</span><h2 id="hub-modal-title">${d.title}</h2></div>
        <button type="button" class="hub-x" ref=${ref} aria-label="Close" onClick=${close}>×</button></div>
      <div class="hub-modal-body">
        <span class="hub-eyebrow">The message</span>
        <p class="hub-quote">“${d.body}”</p>
        <span class="hub-eyebrow">What happens</span>
        <div class="hub-change"><b>SEND TO</b><span>${d.to}</span></div>
        <div class="hub-change"><b>WHEN</b><span>${d.whenLong}</span></div>
      </div>
      <div class="hub-modal-actions">
        <button type="button" class="hub-ghost" onClick=${()=>{up(n=>{n.drafts.find(x=>x.id===d.id).status="aside"},"Set aside. Nothing was sent.");close()}}>Set aside</button>
        <button type="button" class="hub-primary" onClick=${()=>{up(n=>{n.drafts.find(x=>x.id===d.id).status="approved";if(d.id==="d1")n.timecards.forEach(t=>{if(t.status==="notin")t.status="reminded"})},"Approved. It sends on schedule.",[`You approved “${d.title}”`,"SCHEDULED"]);close()}}>Approve and schedule</button>
      </div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body></html>
